[package]
name = "cesium-asset-service"
version = "1.0.0"
edition = "2021"

[dependencies]
base64 = "0.22"
hmac = "0.12"
postgres = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
# Pin a Rust 1.75-compatible resolver target; newer cpufeatures releases use
# Edition 2024, while the production Rust image is deliberately Rust 1.79.
cpufeatures = "=0.2.17"

[package]
name = "context-tiles-service"
version = "1.0.0"
edition = "2021"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
postgres = { version = "0.19", features = ["with-serde_json-1", "with-chrono-0_4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
cpufeatures = "=0.2.17"

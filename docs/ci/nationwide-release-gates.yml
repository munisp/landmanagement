name: Nationwide Release Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nationwide-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'
  GO_VERSION: '1.22'
  RUST_VERSION: 'stable'

jobs:
  typescript-and-migrations:
    name: TypeScript, web/mobile, and PostgreSQL migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: landmanagement_ci
          POSTGRES_USER: landmanagement
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'ci_only_password' }}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U landmanagement -d landmanagement_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-bookworm
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply every ordered PostgreSQL migration
        env:
          POSTGRES_URL: postgresql://landmanagement:${{ secrets.CI_POSTGRES_PASSWORD || 'ci_only_password' }}@localhost:5432/landmanagement_ci
        run: |
          for migration in $(find drizzle -maxdepth 1 -name '*.sql' -print | sort -V); do
            PGPASSWORD="${{ secrets.CI_POSTGRES_PASSWORD || 'ci_only_password' }}" psql \
              --set ON_ERROR_STOP=1 \
              --host localhost --username landmanagement --dbname landmanagement_ci \
              --file "$migration"
          done
      - name: Type-check server and PWA
        run: pnpm check
      - name: Compile production PWA and server bundle
        run: pnpm build
      - name: Run deterministic TypeScript tests
        env:
          POSTGRES_URL: postgresql://landmanagement:${{ secrets.CI_POSTGRES_PASSWORD || 'ci_only_password' }}@localhost:5432/landmanagement_ci
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
        run: pnpm test
      - name: Compile Expo mobile client
        working-directory: mobile
        run: pnpm exec tsc --noEmit

  python:
    name: Lakehouse Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install locked Lakehouse requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f lakehouse/requirements.txt ]; then python -m pip install -r lakehouse/requirements.txt; fi
          python -m pip install pytest
      - name: Run Lakehouse tests
        env:
          PYTHONPATH: ${{ github.workspace }}/lakehouse
        run: python -m pytest lakehouse/tests -q

  go:
    name: Go service checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Format, build, and test every Go module
        run: |
          while IFS= read -r module; do
            directory=$(dirname "$module")
            echo "Checking $directory"
            (cd "$directory" && gofmt -w -l . | (! grep .) && go mod tidy && go build ./... && go test ./... -count=1)
          done < <(find go-services -name go.mod -print | sort)

  rust:
    name: Rust service checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - name: Format, lint, and test every Rust module
        run: |
          while IFS= read -r manifest; do
            directory=$(dirname "$manifest")
            echo "Checking $directory"
            (cd "$directory" && cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test --all-targets)
          done < <(find rust-services -name Cargo.toml -print | sort)

  release-security-and-provenance:
    name: Security, provenance, and deployment controls
    runs-on: ubuntu-latest
    needs: [typescript-and-migrations, python, go, rust]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify release controls and deployment manifest
        run: bash scripts/release/verify-release.sh
      - name: Fail on high or critical Node dependency findings
        run: pnpm audit --audit-level=high
      - name: Scan source and IaC for high or critical vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Generate component inventory and release provenance
        run: bash scripts/release/write-component-inventory.sh artifacts
      - name: Generate CycloneDX production dependency inventory
        run: node scripts/release/write-sbom.mjs artifacts/sbom.cdx.json
      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: nationwide-release-evidence-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error

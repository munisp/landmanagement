global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'idlr-pts'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules/mapping_alerts.yml
  - /etc/prometheus/rules/context_globe_alerts.yml
  - /etc/prometheus/rules/stakeholder_journey_alerts.yml

scrape_configs:
  - job_name: 'idlr-pts-app'
    static_configs:
      - targets: ['app:3000']
    metrics_path: '/api/metrics'
    scrape_interval: 30s

  - job_name: 'apisix'
    static_configs:
      - targets: ['apisix:9091']
    metrics_path: '/apisix/prometheus/metrics'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']

  - job_name: 'go-api-gateway'
    static_configs:
      - targets: ['go-api-gateway:8090']
    metrics_path: '/metrics'

  - job_name: 'lakehouse-api'
    static_configs:
      - targets: ['lakehouse-api:8000']
    metrics_path: '/metrics'

  - job_name: 'portfolio-integration-gateway'
    static_configs:
      - targets: ['portfolio-integration-gateway:8096']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'portfolio-spatial-engine'
    static_configs:
      - targets: ['portfolio-spatial-engine:8097']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'stakeholder-journey-temporal-worker'
    static_configs:
      - targets: ['stakeholder-journey-temporal-worker:9465']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'sedona-job-worker'
    static_configs:
      - targets: ['sedona-job-worker:9108']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'vector-tile-service'
    static_configs:
      - targets: ['vector-tile-service:7021']
    metrics_path: '/metrics'

  - job_name: 'cesium-asset-service'
    static_configs:
      - targets: ['cesium-asset-service:7022']
    metrics_path: '/metrics'

  - job_name: 'context-stream-gateway'
    static_configs:
      - targets: ['context-stream-gateway:8091']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'context-tiles-service'
    static_configs:
      - targets: ['context-tiles-service:8092']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'context-globe-ingestion'
    static_configs:
      - targets: ['context-globe-ingestion:8093']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'temporal'
    static_configs:
      - targets: ['temporal:8000']
    metrics_path: '/metrics'

  - job_name: 'dapr'
    static_configs:
      - targets: ['dapr-sidecar:9090']
    metrics_path: '/metrics'
